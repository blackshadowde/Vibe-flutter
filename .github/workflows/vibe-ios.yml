name: Vibe iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for AltStore / SideStore (GitHub release + update the source)'
        type: boolean
        default: false
      number:
        description: 'Build number (empty = next one). Vibe release fills this in so iPhone gets the same version as Android.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - run: flutter pub get

      # flutter_contacts crashes at launch on iOS 27 (trap inside register(with:)).
      # Make its iOS registration a no-op for this CI build only. Nothing in the
      # repo changes, and the Android workflows are untouched.
      - name: Disable flutter_contacts iOS registration
        run: |
          python3 - <<'PYEOF'
          import glob, os, re
          root = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          files = glob.glob(f"{root}/flutter_contacts-*/ios/**/*.swift", recursive=True)
          patched = 0
          for f in files:
              s = open(f).read()
              m = re.search(r"static\s+func\s+register\s*\(\s*with\s+\w+\s*:\s*FlutterPluginRegistrar\s*\)\s*\{", s)
              if not m:
                  continue
              i, depth = m.end(), 1
              while depth:
                  depth += {"{": 1, "}": -1}.get(s[i], 0)
                  i += 1
              open(f, "w").write(s[:m.end()] + "\n    // disabled for iOS build\n  }" + s[i:])
              patched += 1
              print("patched", f)
          assert patched, "register(with:) not found in flutter_contacts"
          PYEOF

      # Third-party signers replace the Apple team, which drops the app group
      # (group.app.vibe.chat). The app then can't read its keychain/database
      # key and sits on a white screen. For this CI build only, stop using the
      # app group. Android builds never run this workflow.
      - name: Make storage work without the app group
        run: |
          python3 - <<'PYEOF'
          def sub(path, old, new):
              s = open(path).read()
              assert old in s, f"{old!r} not found in {path}"
              open(path, "w").write(s.replace(old, new))
          d = "lib/utils/matrix_sdk_extensions/flutter_matrix_dart_sdk_database/"
          sub(d + "cipher.dart",
              "IOSOptions(groupId: 'group.app.vibe.chat')", "IOSOptions()")
          sub(d + "builder.dart",
              "Directory(containerPath!)",
              "Directory(containerPath ?? (await getTemporaryDirectory()).path)")
          PYEOF

      - name: Vibe app name
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Vibe" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Vibe" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/Runner/Info.plist

      # Optional: if this step fails the build still goes on with the old icon.
      - name: Vibe app icon
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PYEOF'
          import glob
          from PIL import Image
          src = Image.open("vibe-icon.png").convert("RGBA")
          W, H = src.size
          c = 400
          crop = src.crop(((W - c) // 2, (H - c) // 2, (W - c) // 2 + c, (H - c) // 2 + c))
          for f in glob.glob("ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png"):
              size = Image.open(f).size
              bg = Image.new("RGB", size, (255, 255, 255))
              icon = crop.resize(size, Image.LANCZOS)
              bg.paste(icon, mask=icon.getchannel("A"))
              bg.save(f)
          print("icons replaced")
          PYEOF

      # Version = major.minor from pubspec.yaml + this run's number, so every
      # build is newer than the last and AltStore / SideStore offer it.
      - name: Build (no code signing)
        run: |
          BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//' | cut -d. -f1-2)
          N="${{ inputs.number }}"
          if [ -z "$N" ]; then
            # newer than every iPhone release so far (and this run's number)
            LAST=$(git ls-remote --tags origin 'ios-v*' | sed -E 's#.*/ios-v##; s/\^\{\}//' | awk -F. '{print $NF}' | sort -n | tail -1)
            N=${{ github.run_number }}
            if [ -n "$LAST" ] && [ "$LAST" -ge "$N" ]; then N=$((LAST + 1)); fi
          fi
          VERSION="$BASE.$N"
          echo "VIBE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VIBE_BUILD=$N" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign \
            --build-name="$VERSION" --build-number="$N"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Vibe-unsigned.ipa Payload
          cp Vibe-unsigned.ipa Vibe.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-ios-unsigned
          path: Vibe-unsigned.ipa

      # A separate "ios-v..." release (never marked latest, so Android's
      # in-app updater keeps finding the APK release).
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish }}
        with:
          tag_name: ios-v${{ env.VIBE_VERSION }}
          name: Vibe ${{ env.VIBE_VERSION }} for iPhone
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: Vibe.ipa
          body: |
            Vibe ${{ env.VIBE_VERSION }} for iPhone (unsigned, for AltStore / SideStore).

            Add the source once and updates show up in AltStore / SideStore:
            https://raw.githubusercontent.com/blackshadowde/Vibe-flutter/Vibe/altstore.json

      # AltStore / SideStore read this file to find updates.
      - name: Update the AltStore / SideStore source
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z Vibe.ipa)
          git checkout -- . && git clean -fdq -e Vibe.ipa -e Vibe-unsigned.ipa
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          v="$VIBE_VERSION"
          jq --arg v "$v" --arg b "$VIBE_BUILD" --arg d "$(date -u +%Y-%m-%d)" --argjson s "$SIZE" \
            '.apps[0].versions = [{"version": $v, "buildVersion": $b, "date": $d, "size": $s,
              "localizedDescription": ("Vibe " + $v),
              "downloadURL": ("https://github.com/blackshadowde/Vibe-flutter/releases/download/ios-v" + $v + "/Vibe.ipa")}]
              + [.apps[0].versions[] | select(.version != $v)][0:9]' \
            altstore.json > altstore.tmp && mv altstore.tmp altstore.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json
          git commit -qm "AltStore source: Vibe $v for iPhone" && git push -q origin HEAD:"${GITHUB_REF_NAME}" || echo "source unchanged"
