name: Vibe build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Apply Vibe branding (icon, splash, in-app logo)
        run: |
          set -euo pipefail
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          SRC=vibe-icon.png
          BLUE='#226DFD'
          NIGHT_BG='#10112A'
          TMP=$(mktemp -d)

          test -f "$SRC" || { echo "vibe-icon.png is missing from the repo root"; exit 1; }

          # 1) Launcher icon for old Android (square), cropped around the bubble
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            IFS=: read -r d px <<< "$spec"
            "$IM" "$SRC" -gravity center -crop 400x400+0+0 +repage -resize "${px}x${px}" "$RES/mipmap-$d/ic_launcher.png"
          done

          # 2) Adaptive launcher icon (Android 8+), white background, no themed/monochrome layer
          mkdir -p "$RES/drawable-nodpi"
          "$IM" -size 432x432 xc:white \( "$SRC" -resize 398x398 \) -gravity center -composite "$RES/drawable-nodpi/vibe_icon_fg.png"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/vibe_icon_fg"/>
          </adaptive-icon>
          XML

          # 3) Bubble silhouette (white = solid) used for splash and mono logo
          "$IM" "$SRC" -channel R -separate +channel -negate -level 0%,87% "$TMP/mask_full.png"
          "$IM" "$TMP/mask_full.png" -trim +repage "$TMP/mask_trim.png"

          make_logo() { # size, bubble-percent-of-canvas, output
            local s=$1 pct=$2 out=$3
            local inner=$(( s * pct / 100 ))
            "$IM" -size "${s}x${s}" xc:black \( "$TMP/mask_trim.png" -resize "${inner}x${inner}" \) -gravity center -composite "$TMP/m.png"
            "$IM" -size "${s}x${s}" "xc:$BLUE" "$TMP/m.png" -alpha off -compose CopyOpacity -composite "PNG32:$out"
          }

          # 4) Start-up splash screen (logo + dark background)
          for spec in mdpi:177 hdpi:265 xhdpi:354 xxhdpi:531 xxxhdpi:709; do
            IFS=: read -r d px <<< "$spec"
            make_logo "$px" 72 "$RES/drawable-$d/splash.png"
          done
          "$IM" -size 1x1 "xc:$NIGHT_BG" "PNG24:$RES/drawable-night/background.png"

          # 5) Logos inside the app (login/intro screen, empty chat page, lock screen)
          "$IM" "$SRC" -gravity center -crop 400x400+0+0 +repage -resize 500x500 "PNG24:assets/logo/mini/logo_mini.png"
          make_logo 500 84 "assets/logo/mini/logo_mono_mini.png"

          echo "Vibe branding applied"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - run: flutter pub get

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
