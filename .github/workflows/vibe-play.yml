name: Vibe for Google Play (app bundle)

# Builds the Google Play version of Vibe as an .aab to upload in the Play
# Console. Same code as the GitHub APK, except: no built-in updater and no
# "install apps" permission (Play does the updating).
on:
  workflow_dispatch:
    inputs:
      number:
        description: 'Version code (empty = the newest GitHub release number, so Play and GitHub show the same version). Must be higher than anything uploaded to Play before.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the earlier release tags, for the automatic notes

      - name: Apply Vibe branding (icon, splash, in-app logo)
        run: |
          set -euo pipefail
          test -f vibe-icon.png || { echo "vibe-icon.png is missing from the repo root"; exit 1; }
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image, ImageChops
          RES = "android/app/src/main/res"
          BLUE = (0x22, 0x6D, 0xFD)
          NIGHT = (0x10, 0x11, 0x2A)
          src = Image.open("vibe-icon.png").convert("RGBA")
          W, H = src.size
          c = 400
          crop = src.crop(((W - c) // 2, (H - c) // 2, (W - c) // 2 + c, (H - c) // 2 + c))
          for d, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              crop.resize((px, px), Image.LANCZOS).save(f"{RES}/mipmap-{d}/ic_launcher.png")

          os.makedirs(f"{RES}/drawable-nodpi", exist_ok=True)
          fg = Image.new("RGBA", (432, 432), (255, 255, 255, 255))
          s398 = src.resize((398, 398), Image.LANCZOS)
          fg.alpha_composite(s398, (17, 17))
          fg.save(f"{RES}/drawable-nodpi/vibe_icon_fg.png")
          open(f"{RES}/mipmap-anydpi-v26/ic_launcher.xml", "w").write(
          '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/vibe_icon_fg"/>
          </adaptive-icon>
          ''')

          # bubble silhouette: red channel, inverted, 87% level
          r = src.getchannel("R")
          mask = r.point(lambda v: min(255, int((255 - v) * 255 / (0.87 * 255) + 0.5)))
          mask = mask.crop(mask.getbbox())

          def make_logo(s, pct, out):
              inner = s * pct // 100
              m = mask.copy()
              m.thumbnail((inner, inner), Image.LANCZOS)
              # scale up if smaller than inner (like ImageMagick -resize)
              w, h = m.size
              k = inner / max(w, h)
              if k > 1:
                  m = m.resize((round(w * k), round(h * k)), Image.LANCZOS)
              canvas = Image.new("L", (s, s), 0)
              canvas.paste(m, ((s - m.size[0]) // 2, (s - m.size[1]) // 2))
              img = Image.new("RGBA", (s, s), BLUE + (255,))
              img.putalpha(canvas)
              img.save(out)

          for d, px in [("mdpi", 177), ("hdpi", 265), ("xhdpi", 354), ("xxhdpi", 531), ("xxxhdpi", 709)]:
              make_logo(px, 72, f"{RES}/drawable-{d}/splash.png")
          Image.new("RGB", (1, 1), NIGHT).save(f"{RES}/drawable-night/background.png")

          crop.convert("RGB").resize((500, 500), Image.LANCZOS).save("assets/logo/mini/logo_mini.png")
          make_logo(500, 84, "assets/logo/mini/logo_mono_mini.png")
          print("Vibe branding applied")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      # No Firebase / Google services in Vibe: notifications come over Vibe's
      # own connection or ntfy, so nothing from Google is built in.


      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ] || [ -z "${KSPASS:-}" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first"
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > android/key.jks
          {
            echo "storePassword=$KSPASS"
            echo "keyPassword=$KSPASS"
            echo "keyAlias=vibe"
            echo "storeFile=../key.jks"
          } > android/key.properties

      - run: flutter pub get

      - name: Check code (fails fast with the exact error)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.txt || {
            # Each error also shows on the run's summary page.
            grep -E "^\s*error " analyze.txt | head -50 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Play version (app ID app.vibe.chat, no updater, no "install apps" or photo-library permission)
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$M"
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' "$M"
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$M"; then echo "::error::permission still there"; exit 1; fi
          echo "removed REQUEST_INSTALL_PACKAGES"
          # Play allows full photo-library access only for gallery-type apps;
          # the Play build uses the system photo picker instead.
          for P in READ_MEDIA_IMAGES READ_MEDIA_VIDEO; do
            sed -i "/android.permission.$P\"/d" "$M"
            if grep -q "$P" "$M"; then echo "::error::$P still there"; exit 1; fi
          done
          echo "removed READ_MEDIA_IMAGES and READ_MEDIA_VIDEO"
          # com.vibe.app is taken on Google Play by another developer, so the
          # Play version is its own app: app.vibe.chat. GitHub keeps com.vibe.app.
          G=android/app/build.gradle.kts
          sed -i 's/applicationId = "com.vibe.app"/applicationId = "app.vibe.chat"/' "$G"
          grep -q 'applicationId = "app.vibe.chat"' "$G" || { echo "::error::app ID not changed"; exit 1; }
          echo "app ID app.vibe.chat"

      - name: Build app bundle
        run: |
          set -euo pipefail
          N="${{ inputs.number }}"
          if [ -z "$N" ]; then
            N=$(git tag -l 'v*' | sed -E 's/^v//' | awk -F. '{print $NF}' | sort -n | tail -1)
          fi
          BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//' | cut -d. -f1-2)
          VERSION="$BASE.$N"
          echo "VIBE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Vibe $VERSION (version code $N) for Google Play"
          flutter build appbundle --release --target-platform android-arm64 \
            --dart-define=VIBE_STORE=play \
            --build-name="$VERSION" --build-number="$N" 2>&1 | tee build.txt || {
            grep -E "What went wrong|error:|Error:|e: |FAILURE|Could not|Execution failed|> " build.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp build/app/outputs/bundle/release/app-release.aab "Vibe-$VERSION-play.aab"
          echo "::notice title=Play bundle::Vibe-$VERSION-play.aab (version code $N). Download it under Artifacts and upload it in the Play Console."

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-play-${{ env.VIBE_VERSION }}
          path: Vibe-${{ env.VIBE_VERSION }}-play.aab
