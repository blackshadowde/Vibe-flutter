name: Vibe security scans

# Independent checks, kept apart from the release so they can never block or
# change it. Results: the run's summary page, the files under "Artifacts",
# and (CodeQL) the repository's Security tab.
on:
  workflow_dispatch:
  push:
    branches: [Vibe]
  schedule:
    - cron: '17 3 * * 1' # every Monday

permissions:
  contents: read

jobs:
  # GitHub's code scanner. It reads the release workflows for injection and
  # permission mistakes. (CodeQL has no Dart support, so the app code itself
  # is covered by the MobSF scan of the built APK below.)
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v4
        with:
          category: actions
          output: sarif
      - name: List CodeQL findings on this run
        run: |
          N=0
          for f in sarif/*.sarif; do
            [ -f "$f" ] || continue
            while IFS=$'\t' read -r rule file line msg; do
              [ -z "$rule" ] && continue
              N=$((N + 1))
              echo "::warning file=$file,line=$line,title=CodeQL $rule::$msg"
            done < <(jq -r '.runs[].results[]? | [.ruleId, (.locations[0].physicalLocation.artifactLocation.uri // "?"), (.locations[0].physicalLocation.region.startLine // 1), (.message.text | gsub("\n"; " "))] | @tsv' "$f")
          done
          echo "::notice title=CodeQL::$N finding(s) in the workflows"
          echo "## CodeQL: $N finding(s)" >> "$GITHUB_STEP_SUMMARY"

  # Known security holes in the libraries Vibe uses (pubspec.lock), from the
  # OSV database (Google, open data).
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: OSV-Scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          OSV="$(go env GOPATH)/bin/osv-scanner"
          "$OSV" --version
          set +e
          "$OSV" scan source --lockfile=pubspec.lock --format=markdown > osv.md
          CODE=$?
          "$OSV" scan source --lockfile=pubspec.lock --format=json > osv.json 2>/dev/null
          set -e
          # one line per vulnerable library, readable on the run page
          jq -r '.results[]?.packages[]? | "\(.package.name) \(.package.version): \([.vulnerabilities[]?.id] | join(", "))"' osv.json 2>/dev/null \
            | while read -r l; do echo "::warning title=Vulnerable dependency::$l"; done
          echo "::notice title=OSV-Scanner::exit $CODE (0 = nothing known, 1 = see warnings)"
          {
            echo "## Dependencies (OSV-Scanner)"
            echo
            if [ "$CODE" = 0 ]; then echo "No known vulnerabilities in pubspec.lock."; else cat osv.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat osv.md || true
          # 1 = vulnerabilities found (shown above); anything else is a tool error
          if [ "$CODE" != 0 ] && [ "$CODE" != 1 ]; then exit "$CODE"; fi

  # MobSF (Mobile Security Framework, OWASP MASVS checks) on the newest
  # released APK: permissions, code, network and storage issues.
  mobsf:
    runs-on: ubuntu-24.04
    steps:
      - name: Newest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          ls -la apk
      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 \
            -e MOBSF_API_KEY=vibe-ci-key \
            opensecurity/mobile-security-framework-mobsf:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 5
          done
          curl -sf http://localhost:8000/ > /dev/null
      - name: Scan
        run: |
          set -euo pipefail
          K="Authorization: vibe-ci-key"
          APK=$(ls apk/*.apk | head -1)
          UP=$(curl -sf -H "$K" -F "file=@$APK" http://localhost:8000/api/v1/upload)
          HASH=$(echo "$UP" | jq -r .hash)
          curl -sf -H "$K" --max-time 1800 -d "hash=$HASH" http://localhost:8000/api/v1/scan > /dev/null
          curl -sf -H "$K" -d "hash=$HASH" http://localhost:8000/api/v1/report_json > mobsf.json
          curl -sf -H "$K" -d "hash=$HASH" http://localhost:8000/api/v1/download_pdf > mobsf.pdf || true
          curl -sf -H "$K" -d "hash=$HASH" http://localhost:8000/api/v1/scorecard > scorecard.json || true
          SCORE=$(jq -r '.security_score // "n/a"' scorecard.json 2>/dev/null || echo n/a)
          echo "::notice title=MobSF::$(basename "$APK") security score $SCORE / 100"
          for lvl in high warning; do
            jq -r --arg l "$lvl" '.[$l] // [] | .[] | (.title // .) | tostring' scorecard.json 2>/dev/null \
              | while read -r t; do echo "::warning title=MobSF $lvl::$t"; done
          done
          # where each code finding is: the library / file it comes from
          jq -r '(.code_analysis.findings // {}) | to_entries[]
                 | select((.value.metadata.severity // "") | test("high|warning"; "i"))
                 | "\(.value.metadata.severity) | \(.key) | \(.value.metadata.description // "" | .[0:120]) | \((.value.files // {}) | keys | .[0:6] | join(" , "))"' mobsf.json 2>/dev/null \
            | while read -r l; do echo "::warning title=MobSF code::$l"; done
          {
            echo "## MobSF: $(basename "$APK")"
            echo
            echo "Security score: $(jq -r '.security_score // "n/a"' scorecard.json 2>/dev/null) / 100"
            echo
            for lvl in high warning info secure hotspot; do
              n=$(jq -r --arg l "$lvl" '.[$l] // [] | length' scorecard.json 2>/dev/null || echo "?")
              echo "- $lvl: $n"
            done
            echo
            echo "The full report (PDF and JSON) is under Artifacts on this run."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobsf-report
          path: |
            mobsf.json
            mobsf.pdf
            scorecard.json
          if-no-files-found: ignore
