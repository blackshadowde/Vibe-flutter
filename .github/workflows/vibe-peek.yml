name: Vibe peek
on:
  push:
    branches: [peek]
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect matrix-widget-api
        run: |
          mkdir p && cd p
          npm pack matrix-widget-api@1.13.0 >/dev/null && tar xzf matrix-widget-api-1.13.0.tgz
          ls package package/dist package/lib | tr '\n' ' ' | sed 's/^/::notice title=files::/'; echo
          head -c 300 package/dist/api.js | tr '\n' ' ' | sed 's/^/::notice title=head::/'; echo
          grep -o 'mxwidgets\|ClientWidgetApi\|WidgetDriver' package/dist/api.min.js | sort | uniq -c | tr '\n' ' ' | sed 's/^/::notice title=minnames::/'; echo
          node -e "global.window=global; global.self=global; require('./package/dist/api.js'); const m=global.mxwidgets; console.log('::notice title=global::'+(m?Object.keys(m).join(','):'none'))" || true
          node -e "const m=require('./package/lib/index.js'); console.log('::notice title=lib::'+Object.keys(m).join(','))" || true
          grep -n '"main"\|"browser"\|"build' package/package.json | tr '\n' ' ' | sed 's/^/::notice title=pkg::/'; echo
