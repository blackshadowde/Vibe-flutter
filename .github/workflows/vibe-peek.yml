name: Vibe peek
on:
  push:
    branches: [peek]
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect packages
        run: |
          set -x
          mkdir p && cd p
          npm pack @element-hq/element-call-embedded@0.16.3 >/dev/null
          npm view @element-hq/element-call-embedded versions --json | tail -6 | tr -d '\n' | sed 's/^/::notice title=ecver::/'; echo
          tar xzf element-hq-element-call-embedded-0.16.3.tgz
          du -sh package/dist | sed 's/^/::notice title=ecsize::/'
          find package -maxdepth 3 -not -path '*/assets/*' | tr '\n' ' ' | sed 's/^/::notice title=ecfiles::/'; echo
          ls package/dist/assets | wc -l | sed 's/^/::notice title=ecassets::/'
          ls -S package/dist/assets | head -15 | tr '\n' ' ' | sed 's/^/::notice title=ecbig::/'; echo
          cat package/package.json | tr '\n' ' ' | cut -c1-1500 | sed 's/^/::notice title=ecpkg::/'; echo
          [ -f package/dist/config.json ] && cat package/dist/config.json | tr '\n' ' ' | sed 's/^/::notice title=ecconfig::/'; echo
          head -c 1500 package/dist/index.html | tr '\n' ' ' | sed 's/^/::notice title=echtml::/'; echo
          npm pack matrix-widget-api@1.13.0 >/dev/null; tar xzf matrix-widget-api-1.13.0.tgz -C . --one-top-level=mwa
          find mwa -maxdepth 3 -name '*.js' | grep -v '/lib/' | head -20 | tr '\n' ' ' | sed 's/^/::notice title=mwafiles::/'; echo
          ls mwa/package/dist 2>/dev/null | tr '\n' ' ' | sed 's/^/::notice title=mwadist::/'; echo
          npm view matrix-widget-api version | sed 's/^/::notice title=mwalatest::/'
          grep -o 'feedStateUpdate\|feedToDevice\|setViewedRoomId\|getKnownRooms' -r mwa/package/lib/ClientWidgetApi.js | sort | uniq -c | tr '\n' ' ' | sed 's/^/::notice title=mwaapi::/'; echo
          grep -rho 'searchParams.get("[a-zA-Z]*")\|getParam("[a-zA-Z]*"' package/dist/assets/*.js | sort -u | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::notice title=ecparams::/'; echo
      - name: Pub versions
        run: |
          for p in flutter_inappwebview flutter_inappwebview_android permission_handler webview_flutter webview_flutter_android flutter_foreground_task; do
            v=$(curl -s https://pub.dev/api/packages/$p | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['latest']['version'], d['latest']['published'][:10], [v['version'] for v in d['versions'][-5:]])")
            echo "::notice title=pub $p::$v"
          done
