name: Build TDLib (Telegram library)

# Builds Telegram's official TDLib for Android from source and publishes it
# as a pre-release ("tdlib-<version>"), so the Vibe builds can download it
# instead of compiling it every time (it takes about an hour).
# Run this once, and again only when TDLib should be updated.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'TDLib commit to build'
        default: 'c15d3f5a5de6e3ba5839822c451152e5e18bb700'
      tag:
        description: 'Release tag to publish'
        default: 'tdlib-1.8.68'

permissions:
  contents: write

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gperf php-cli zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # A finished build is kept, so publishing again doesn't rebuild.
      - name: Reuse an earlier build
        id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: tdlib-android-${{ inputs.commit }}-v1

      - name: Get TDLib source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tdlib/td.git td
          cd td && git checkout "${{ inputs.commit }}"

      - name: Android SDK and NDK
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: TDLib (JSON interface for Java/Kotlin)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: td/example/android
        # 64-bit and 32-bit ARM phones, Android 5.0+.
        run: ./build-tdlib.sh '' '' '' '' 'JSONJava' 21 'arm64-v8a armeabi-v7a'

      - name: Package
        run: |
          if [ ! -d out/libs ]; then
            mkdir -p out
            cp -r td/example/android/tdlib/libs out/
            cp td/example/android/tdlib/java/org/drinkless/tdlib/JsonClient.java out/
            cp td/LICENSE_1_0.txt out/
            echo "${{ inputs.commit }}" > out/COMMIT
          fi
          (cd out && zip -qr ../tdlib-android.zip .)
          ls -la out/libs/*

      - uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: tdlib-android.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TDLib for Vibe (${{ inputs.tag }})
          body: "Telegram's TDLib built from source at commit ${{ inputs.commit }} (Boost Software License 1.0). Used by Vibe's Telegram support; not an app release."
          prerelease: true
          make_latest: false
          files: tdlib-android.zip
          overwrite_files: true
