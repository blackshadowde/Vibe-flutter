name: Vibe release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as a public GitHub Release (download page)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Apply Vibe branding (icon, splash, in-app logo)
        run: |
          set -euo pipefail
          test -f vibe-icon.png || { echo "vibe-icon.png is missing from the repo root"; exit 1; }
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image, ImageChops
          RES = "android/app/src/main/res"
          BLUE = (0x22, 0x6D, 0xFD)
          NIGHT = (0x10, 0x11, 0x2A)
          src = Image.open("vibe-icon.png").convert("RGBA")
          W, H = src.size
          c = 400
          crop = src.crop(((W - c) // 2, (H - c) // 2, (W - c) // 2 + c, (H - c) // 2 + c))
          for d, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              crop.resize((px, px), Image.LANCZOS).save(f"{RES}/mipmap-{d}/ic_launcher.png")

          os.makedirs(f"{RES}/drawable-nodpi", exist_ok=True)
          fg = Image.new("RGBA", (432, 432), (255, 255, 255, 255))
          s398 = src.resize((398, 398), Image.LANCZOS)
          fg.alpha_composite(s398, (17, 17))
          fg.save(f"{RES}/drawable-nodpi/vibe_icon_fg.png")
          open(f"{RES}/mipmap-anydpi-v26/ic_launcher.xml", "w").write(
          '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/vibe_icon_fg"/>
          </adaptive-icon>
          ''')

          # bubble silhouette: red channel, inverted, 87% level
          r = src.getchannel("R")
          mask = r.point(lambda v: min(255, int((255 - v) * 255 / (0.87 * 255) + 0.5)))
          mask = mask.crop(mask.getbbox())

          def make_logo(s, pct, out):
              inner = s * pct // 100
              m = mask.copy()
              m.thumbnail((inner, inner), Image.LANCZOS)
              # scale up if smaller than inner (like ImageMagick -resize)
              w, h = m.size
              k = inner / max(w, h)
              if k > 1:
                  m = m.resize((round(w * k), round(h * k)), Image.LANCZOS)
              canvas = Image.new("L", (s, s), 0)
              canvas.paste(m, ((s - m.size[0]) // 2, (s - m.size[1]) // 2))
              img = Image.new("RGBA", (s, s), BLUE + (255,))
              img.putalpha(canvas)
              img.save(out)

          for d, px in [("mdpi", 177), ("hdpi", 265), ("xhdpi", 354), ("xxhdpi", 531), ("xxxhdpi", 709)]:
              make_logo(px, 72, f"{RES}/drawable-{d}/splash.png")
          Image.new("RGB", (1, 1), NIGHT).save(f"{RES}/drawable-night/background.png")

          crop.convert("RGB").resize((500, 500), Image.LANCZOS).save("assets/logo/mini/logo_mini.png")
          make_logo(500, 84, "assets/logo/mini/logo_mono_mini.png")
          print("Vibe branding applied")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Push notifications (Firebase)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GSJ:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set - building WITHOUT push notifications"
            exit 0
          fi
          # accept the raw JSON file contents or a base64 of it
          if printf '%s' "$GSJ" | python3 -c 'import sys,json; json.load(sys.stdin)' 2>/dev/null; then
            printf '%s' "$GSJ" > android/app/google-services.json
          else
            printf '%s' "$GSJ" | base64 -d > android/app/google-services.json
          fi
          PKG=$(python3 -c 'import json; print(json.load(open("android/app/google-services.json"))["client"][0]["client_info"]["android_client_info"]["package_name"])')
          echo "Firebase package name: $PKG"
          sed -i -E "s/applicationId = \"[^\"]*\"/applicationId = \"$PKG\"/" android/app/build.gradle.kts
          grep -n "applicationId" android/app/build.gradle.kts
          ./scripts/add-firebase-messaging.sh
          echo "Push notifications: ENABLED ($PKG)"

      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ] || [ -z "${KSPASS:-}" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first"
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > android/key.jks
          {
            echo "storePassword=$KSPASS"
            echo "keyPassword=$KSPASS"
            echo "keyAlias=vibe"
            echo "storeFile=../key.jks"
          } > android/key.properties

      - run: flutter pub get

      - name: Check code (fails fast with the exact error)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        env:
          VIBE_PUSH_GATEWAY: ${{ vars.VIBE_PUSH_GATEWAY }}
        run: |
          EXTRA=""
          if [ -n "$VIBE_PUSH_GATEWAY" ]; then EXTRA="--dart-define=VIBE_PUSH_GATEWAY=$VIBE_PUSH_GATEWAY"; fi
          # Version = major.minor from pubspec.yaml + this run's number,
          # e.g. 1.1.37 (build code 37). Every release gets a new number.
          BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//' | cut -d. -f1-2)
          VERSION="$BASE.${{ github.run_number }}"
          echo "VIBE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Vibe $VERSION"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-${{ env.VIBE_VERSION }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "Vibe-${VIBE_VERSION}.apk"
          {
            echo "## Vibe ${VIBE_VERSION}"
            echo
            if [ -s RELEASE_NOTES.md ]; then
              echo "### What's new in this update"
              echo
              cat RELEASE_NOTES.md
              echo
            fi
            echo "---"
            echo
            echo "A Discord-style, end-to-end encrypted messenger for Android, built on Matrix."
            echo
            echo "**Download:** tap \`Vibe-${VIBE_VERSION}.apk\` below, then open it to install"
            echo "(allow \"Install unknown apps\" for your browser when Android asks)."
            echo
            echo "**Updating:** install the new APK over the old one; your chats stay."
            echo
            echo "Free and open source (AGPL-3.0), based on FluffyChat."
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish }}
        with:
          tag_name: v${{ env.VIBE_VERSION }}
          name: Vibe ${{ env.VIBE_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Vibe-${{ env.VIBE_VERSION }}.apk
          body_path: release-body.md
